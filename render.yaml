services:
  # Backend Service
  - type: web
    name: coffee-shop-backend
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: coffee-shop-db
          property: connectionString

  # Frontend Service
  - type: web
    name: coffee-shop-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: coffee-shop-backend
          property: url

databases:
  - name: coffee-shop-db
    plan: free
    databaseName: coffeeshop
    user: coffeeshop_user
